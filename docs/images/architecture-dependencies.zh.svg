<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1000" viewBox="0 0 1680 1000" role="img" aria-labelledby="title desc">
  <title id="title">JiuwenSymbiosis 模块归属与跨层关系</title><desc id="desc">九个架构域的模块归属：六层执行主链，与技能库、感知（环境 perception + 本体 kinematics）、执行记忆三个侧面机制之间的关系与能力门控。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334e68"/></marker><marker id="dash-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#d97706"/></marker><filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#19324d" flood-opacity="0.11"/></filter>
    <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#172033}.title{font-size:29px;font-weight:700}.subtitle{font-size:14px;fill:#5b6b82}.lane{font-size:18px;font-weight:700;fill:#fff}.node{font-size:14px;font-weight:700}.sub{font-size:12px;fill:#5b6b82}.panel{font-size:16px;font-weight:700}.edge{fill:none;stroke:#334e68;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#d97706;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#dash-arrow)}.label{font-size:11px;font-weight:600;fill:#855108}.legend{font-size:12px;fill:#526174}</style>
  </defs>
  <rect width="1680" height="1000" rx="24" fill="#f4f7fc"/><text x="38" y="47" class="title">模块归属与跨层关系</text><text x="38" y="72" class="subtitle">左侧是六层执行主链；右侧集中展示技能库（Skill Library）与「环境感知 · 本体感知 · 记忆」两个指导面</text>

  <!-- 六泳道执行主链 -->
  <g>
    <rect x="32" y="102" width="1118" height="120" rx="16" fill="#eaf3ff" stroke="#aac9f3"/><rect x="32" y="102" width="160" height="120" rx="16" fill="#2563eb"/><rect x="176" y="102" width="16" height="120" fill="#2563eb"/><text x="112" y="153" text-anchor="middle" class="lane">智能体层</text>
    <rect x="32" y="233" width="1118" height="106" rx="16" fill="#fff7e8" stroke="#efc36f"/><rect x="32" y="233" width="160" height="106" rx="16" fill="#d97706"/><rect x="176" y="233" width="16" height="106" fill="#d97706"/><text x="112" y="277" text-anchor="middle" class="lane">护栏层</text>
    <rect x="32" y="350" width="1118" height="102" rx="16" fill="#edf5ff" stroke="#b7d2f7"/><rect x="32" y="350" width="160" height="102" rx="16" fill="#3b82f6"/><rect x="176" y="350" width="16" height="102" fill="#3b82f6"/><text x="112" y="393" text-anchor="middle" class="lane">工具层</text>
    <rect x="32" y="463" width="1118" height="106" rx="16" fill="#f3efff" stroke="#c9bbf3"/><rect x="32" y="463" width="160" height="106" rx="16" fill="#8b5cf6"/><rect x="176" y="463" width="16" height="106" fill="#8b5cf6"/><text x="112" y="507" text-anchor="middle" class="lane">API 层</text>
    <rect x="32" y="580" width="1118" height="106" rx="16" fill="#ecf9f4" stroke="#acd9c6"/><rect x="32" y="580" width="160" height="106" rx="16" fill="#059669"/><rect x="176" y="580" width="16" height="106" fill="#059669"/><text x="112" y="624" text-anchor="middle" class="lane">环境层</text>
    <rect x="32" y="697" width="1118" height="146" rx="16" fill="#e8f7f1" stroke="#9ed2bd"/><rect x="32" y="697" width="160" height="146" rx="16" fill="#047857"/><rect x="176" y="697" width="16" height="146" fill="#047857"/><text x="112" y="760" text-anchor="middle" class="lane">硬件层</text>
  </g>

  <!-- 主链模块 -->
  <g filter="url(#shadow)">
    <rect x="220" y="130" width="185" height="64" rx="11" fill="#fff" stroke="#88afe8"/><text x="313" y="155" text-anchor="middle" class="node">Python / CLI / GUI</text><text x="313" y="175" text-anchor="middle" class="sub">任务入口与 Voice</text>
    <rect x="430" y="130" width="190" height="64" rx="11" fill="#fff" stroke="#88afe8"/><text x="525" y="155" text-anchor="middle" class="node">配置对象</text><text x="525" y="175" text-anchor="middle" class="sub">Adapter + Agent Config</text>
    <rect x="645" y="130" width="210" height="64" rx="11" fill="#fff" stroke="#88afe8"/><text x="750" y="155" text-anchor="middle" class="node">make_builder / Session</text><text x="750" y="175" text-anchor="middle" class="sub">装配与生命周期</text>
    <rect x="880" y="130" width="235" height="64" rx="11" fill="#2563eb"/><text x="998" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">run_robot_task / Agent</text><text x="998" y="176" text-anchor="middle" font-size="11" fill="#dbeafe">两级规划(plan_task) · 运行时重规划</text>
    <rect x="240" y="252" width="875" height="68" rx="12" fill="#fff" stroke="#e8b75d"/><text x="678" y="274" text-anchor="middle" class="node">before_tool_call / after_tool_call 钩子管线</text><text x="678" y="296" text-anchor="middle" class="sub">Safety · Recovery · VisualFeedback · Diagnosis · Trace · SkillUse</text><text x="678" y="313" text-anchor="middle" class="sub">各 Rail 属于同一层，按配置和能力启用</text>
    <rect x="240" y="368" width="875" height="66" rx="12" fill="#fff" stroke="#88afe8"/><text x="678" y="390" text-anchor="middle" class="node">Tool Surface</text><text x="678" y="412" text-anchor="middle" class="sub">build_robot_tools · RobotControlTool · InProcessCodeTool</text><text x="678" y="429" text-anchor="middle" class="sub">运行时只调用已经通过能力门控的动作</text>
    <rect x="240" y="482" width="315" height="68" rx="12" fill="#fff" stroke="#aa94e7"/><text x="397" y="504" text-anchor="middle" class="node">ActionSpec 动作契约</text><text x="397" y="524" text-anchor="middle" class="sub">能力门 · 参数 · 结果形状</text><text x="397" y="541" text-anchor="middle" class="sub">前置条件 · 效果 · 位置新鲜度</text>
    <rect x="580" y="482" width="300" height="68" rx="12" fill="#fff" stroke="#aa94e7"/><text x="730" y="504" text-anchor="middle" class="node">@implements(SPEC)</text><text x="730" y="524" text-anchor="middle" class="sub">把契约绑定到本体实现</text><text x="730" y="541" text-anchor="middle" class="sub">转发 defaults 或自写几何</text>
    <rect x="905" y="482" width="210" height="68" rx="12" fill="#fff" stroke="#aa94e7"/><text x="1010" y="504" text-anchor="middle" class="node">API 能力</text><text x="1010" y="524" text-anchor="middle" class="sub">由已实现动作的 spec 推导</text><text x="1010" y="541" text-anchor="middle" class="sub">与 Env 硬件能力取交集</text>
    <rect x="240" y="599" width="360" height="68" rx="12" fill="#fff" stroke="#76bfa1"/><text x="420" y="624" text-anchor="middle" class="node">BaseRobotEnv</text><text x="420" y="645" text-anchor="middle" class="sub">唯一硬件契约与稳定动词</text>
    <rect x="625" y="599" width="245" height="68" rx="12" fill="#fff" stroke="#76bfa1"/><text x="748" y="624" text-anchor="middle" class="node">RobotObservation</text><text x="748" y="645" text-anchor="middle" class="sub">位姿、关节、图像、状态</text>
    <rect x="895" y="599" width="220" height="68" rx="12" fill="#fff" stroke="#76bfa1"/><text x="1005" y="624" text-anchor="middle" class="node">Env 硬件能力</text><text x="1005" y="645" text-anchor="middle" class="sub">人工 frozenset 声明</text>
    <rect x="240" y="737" width="230" height="68" rx="12" fill="#fff" stroke="#69b396"/><text x="355" y="762" text-anchor="middle" class="node">Vendor Driver</text><text x="355" y="783" text-anchor="middle" class="sub">serial / CAN / SDK</text>
    <rect x="500" y="737" width="300" height="68" rx="12" fill="#047857"/><text x="650" y="762" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Robot / Gripper / Suction</text><text x="650" y="783" text-anchor="middle" font-size="12" fill="#d1fae5">真实机器人本体</text>
    <rect x="830" y="737" width="285" height="68" rx="12" fill="#047857"/><text x="973" y="762" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Camera / Depth</text><text x="973" y="783" text-anchor="middle" font-size="12" fill="#d1fae5">视觉感知的数据源</text>
  </g>
  <path d="M405 162H430" class="edge"/><path d="M620 162H645" class="edge"/><path d="M855 162H880" class="edge"/><path d="M998 194V225H678V252" class="edge"/><path d="M678 320V368" class="edge"/><path d="M678 434V456H730V482" class="edge"/><path d="M555 516H580" class="edge"/><path d="M880 516H905" class="edge"/><path d="M730 550V574H420V599" class="edge"/><path d="M600 633H625" class="edge"/><path d="M420 667V714H355V737" class="edge"/><path d="M470 771H500" class="edge"/><path d="M355 805V826H973V805" class="edge"/>

  <!-- 侧面面板：技能库 · Skill Library -->
  <rect x="1240" y="102" width="388" height="218" rx="16" fill="#f3efff" stroke="#aa94e7"/><text x="1262" y="132" class="panel" fill="#6d28d9">技能库 · Skill Library</text>
  <rect x="1270" y="153" width="328" height="62" rx="11" fill="#fff" stroke="#aa94e7"/><text x="1434" y="178" text-anchor="middle" class="node">SKILL.md</text><text x="1434" y="198" text-anchor="middle" class="sub">visual_pick · visual_place · transport</text>
  <rect x="1270" y="232" width="328" height="62" rx="11" fill="#fff8eb" stroke="#e8b75d"/><text x="1434" y="257" text-anchor="middle" class="node">SkillUseRail 加载并注入</text><text x="1434" y="277" text-anchor="middle" class="sub">提供预先编排好的动作序列，供 Agent 组合</text>

  <!-- 侧面面板：环境感知 · 本体感知 · 记忆（合并指导面） -->
  <rect x="1240" y="335" width="388" height="508" rx="16" fill="#eefaf5" stroke="#83c5aa"/><text x="1262" y="365" class="panel" fill="#047857">环境感知 · 本体感知 · 记忆</text>
  <rect x="1270" y="396" width="328" height="66" rx="10" fill="#fff" stroke="#83c5aa"/><text x="1434" y="424" text-anchor="middle" class="node">perception</text><text x="1434" y="446" text-anchor="middle" class="sub">环境感知：相机 · 深度 · 检测</text>
  <rect x="1270" y="486" width="328" height="66" rx="10" fill="#fff" stroke="#83c5aa"/><text x="1434" y="514" text-anchor="middle" class="node">kinematics</text><text x="1434" y="536" text-anchor="middle" class="sub">本体感知：URDF · 正逆运动学 · 可达性</text>
  <rect x="1270" y="576" width="328" height="66" rx="10" fill="#fff" stroke="#83c5aa"/><text x="1434" y="604" text-anchor="middle" class="node">WorldState + ExecutionMemory</text><text x="1434" y="626" text-anchor="middle" class="sub">执行记忆：感知即入账、移动即作废</text>
  <text x="1434" y="706" text-anchor="middle" class="node" fill="#047857">指引 Agent 动态编排</text>
  <text x="1434" y="736" text-anchor="middle" class="sub">既编排技能（Skill），也编排原子动作（ActionSpec）</text>
  <text x="1434" y="764" text-anchor="middle" class="sub">同一任务在不同环境展开出不同序列</text>

  <!-- 技能库 -> 智能体层 -->
  <path d="M1240 150H1150" class="dash"/><text x="1195" y="140" class="label" text-anchor="middle">支撑 Agent 编排</text>
  <!-- 感知/记忆面板 -> 智能体层 -->
  <path d="M1240 360H1180V218H1150" class="dash"/><text x="1145" y="212" class="label" text-anchor="end">驱动 Agent 动态编排</text>
  <!-- API 层 -> 感知/记忆面板 -->
  <path d="M1150 516H1240" class="dash"/><text x="1195" y="496" class="label" text-anchor="middle">api/defaults</text><text x="1195" y="510" class="label" text-anchor="middle">调用共享算法</text>
  <!-- 环境层 -> 感知/记忆面板 -->
  <path d="M1150 633H1240" class="dash"/><text x="1195" y="623" class="label" text-anchor="middle">观测供本体感知</text>

  <!-- 左侧沟槽：观测与失败上行 -->
  <path d="M228 843V306" class="dash"/><text x="214" y="600" class="label" text-anchor="middle" transform="rotate(-90 214 600)">观测与失败回流到护栏</text>

  <line x1="1040" y1="956" x2="1080" y2="956" stroke="#334e68" stroke-width="2.2"/><text x="1090" y="960" class="legend">主执行依赖</text><line x1="1190" y1="956" x2="1230" y2="956" stroke="#d97706" stroke-width="2.2" stroke-dasharray="7 6"/><text x="1240" y="960" class="legend">指导 / 门控 / 支路 / 回流</text>
</svg>
