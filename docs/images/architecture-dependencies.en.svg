<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1000" viewBox="0 0 1680 1000" role="img" aria-labelledby="title desc">
  <title id="title">JiuwenSymbiosis module ownership and cross-layer relations</title><desc id="desc">Module ownership across nine domains: the six-layer execution chain and how it relates to the Skill Library, to perception (environment perception plus kinematics) and to execution memory, together with capability gating.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334e68"/></marker><marker id="dash-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#d97706"/></marker><filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#19324d" flood-opacity="0.11"/></filter>
    <style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#172033}.title{font-size:29px;font-weight:700}.subtitle{font-size:14px;fill:#5b6b82}.lane{font-size:18px;font-weight:700;fill:#fff}.node{font-size:14px;font-weight:700}.sub{font-size:12px;fill:#5b6b82}.panel{font-size:16px;font-weight:700}.edge{fill:none;stroke:#334e68;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#d97706;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#dash-arrow)}.label{font-size:11px;font-weight:600;fill:#855108}.legend{font-size:12px;fill:#526174}</style>
  </defs>
  <rect width="1680" height="1000" rx="24" fill="#f4f7fc"/><text x="38" y="47" class="title">Module Ownership &amp; Cross-Layer Relations</text><text x="38" y="72" class="subtitle">Six execution-chain lanes on the left; the Skill Library and the Perception · Memory guidance plane on the right.</text>

  <!-- Six execution-chain lanes -->
  <g>
    <rect x="32" y="102" width="1118" height="120" rx="16" fill="#eaf3ff" stroke="#aac9f3"/><rect x="32" y="102" width="160" height="120" rx="16" fill="#2563eb"/><rect x="176" y="102" width="16" height="120" fill="#2563eb"/><text x="112" y="153" text-anchor="middle" class="lane">Agent Layer</text>
    <rect x="32" y="233" width="1118" height="106" rx="16" fill="#fff7e8" stroke="#efc36f"/><rect x="32" y="233" width="160" height="106" rx="16" fill="#d97706"/><rect x="176" y="233" width="16" height="106" fill="#d97706"/><text x="112" y="277" text-anchor="middle" class="lane">Rails Layer</text>
    <rect x="32" y="350" width="1118" height="102" rx="16" fill="#edf5ff" stroke="#b7d2f7"/><rect x="32" y="350" width="160" height="102" rx="16" fill="#3b82f6"/><rect x="176" y="350" width="16" height="102" fill="#3b82f6"/><text x="112" y="393" text-anchor="middle" class="lane">Tool Layer</text>
    <rect x="32" y="463" width="1118" height="106" rx="16" fill="#f3efff" stroke="#c9bbf3"/><rect x="32" y="463" width="160" height="106" rx="16" fill="#8b5cf6"/><rect x="176" y="463" width="16" height="106" fill="#8b5cf6"/><text x="112" y="507" text-anchor="middle" class="lane">API Layer</text>
    <rect x="32" y="580" width="1118" height="106" rx="16" fill="#ecf9f4" stroke="#acd9c6"/><rect x="32" y="580" width="160" height="106" rx="16" fill="#059669"/><rect x="176" y="580" width="16" height="106" fill="#059669"/><text x="112" y="624" text-anchor="middle" class="lane">Env Layer</text>
    <rect x="32" y="697" width="1118" height="146" rx="16" fill="#e8f7f1" stroke="#9ed2bd"/><rect x="32" y="697" width="160" height="146" rx="16" fill="#047857"/><rect x="176" y="697" width="16" height="146" fill="#047857"/><text x="112" y="760" text-anchor="middle" class="lane">Hardware Layer</text>
  </g>

  <!-- Main-lane modules -->
  <g filter="url(#shadow)">
    <rect x="220" y="130" width="185" height="64" rx="11" fill="#fff" stroke="#88afe8"/><text x="313" y="155" text-anchor="middle" class="node">Python / CLI / GUI</text><text x="313" y="175" text-anchor="middle" class="sub">task entry and Voice</text>
    <rect x="430" y="130" width="190" height="64" rx="11" fill="#fff" stroke="#88afe8"/><text x="525" y="155" text-anchor="middle" class="node">Config Objects</text><text x="525" y="175" text-anchor="middle" class="sub">Adapter + Agent Config</text>
    <rect x="645" y="130" width="210" height="64" rx="11" fill="#fff" stroke="#88afe8"/><text x="750" y="155" text-anchor="middle" class="node">make_builder / Session</text><text x="750" y="175" text-anchor="middle" class="sub">assembly and lifecycle</text>
    <rect x="880" y="130" width="235" height="64" rx="11" fill="#2563eb"/><text x="998" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">run_robot_task / Agent</text><text x="998" y="176" text-anchor="middle" font-size="11" fill="#dbeafe">two-tier plan (plan_task) · re-plan</text>
    <rect x="240" y="252" width="875" height="68" rx="12" fill="#fff" stroke="#e8b75d"/><text x="678" y="274" text-anchor="middle" class="node">before_tool_call / after_tool_call hook pipeline</text><text x="678" y="296" text-anchor="middle" class="sub">Safety · Recovery · VisualFeedback · Diagnosis · Trace · SkillUse</text><text x="678" y="313" text-anchor="middle" class="sub">one layer, enabled by config and capability</text>
    <rect x="240" y="368" width="875" height="66" rx="12" fill="#fff" stroke="#88afe8"/><text x="678" y="390" text-anchor="middle" class="node">Tool Surface</text><text x="678" y="412" text-anchor="middle" class="sub">build_robot_tools · RobotControlTool · InProcessCodeTool</text><text x="678" y="429" text-anchor="middle" class="sub">runtime only dispatches actions that passed the capability gate</text>
    <rect x="240" y="482" width="315" height="68" rx="12" fill="#fff" stroke="#aa94e7"/><text x="397" y="504" text-anchor="middle" class="node">ActionSpec Contract</text><text x="397" y="524" text-anchor="middle" class="sub">capability gate · params · result shape</text><text x="397" y="541" text-anchor="middle" class="sub">pre-conditions · effects · location freshness</text>
    <rect x="580" y="482" width="290" height="68" rx="12" fill="#fff" stroke="#aa94e7"/><text x="725" y="504" text-anchor="middle" class="node">@implements(SPEC)</text><text x="725" y="524" text-anchor="middle" class="sub">binds the contract to a body method</text><text x="725" y="541" text-anchor="middle" class="sub">forward defaults or write the geometry</text>
    <rect x="895" y="482" width="220" height="68" rx="12" fill="#fff" stroke="#aa94e7"/><text x="1005" y="504" text-anchor="middle" class="node">API Capabilities</text><text x="1005" y="524" text-anchor="middle" class="sub">derived from implemented specs</text><text x="1005" y="541" text-anchor="middle" class="sub">∩ Env hardware capabilities</text>
    <rect x="240" y="599" width="360" height="68" rx="12" fill="#fff" stroke="#76bfa1"/><text x="420" y="624" text-anchor="middle" class="node">BaseRobotEnv</text><text x="420" y="645" text-anchor="middle" class="sub">single hardware contract and stable verbs</text>
    <rect x="625" y="599" width="245" height="68" rx="12" fill="#fff" stroke="#76bfa1"/><text x="748" y="624" text-anchor="middle" class="node">RobotObservation</text><text x="748" y="645" text-anchor="middle" class="sub">pose, joints, images, state</text>
    <rect x="895" y="599" width="220" height="68" rx="12" fill="#fff" stroke="#76bfa1"/><text x="1005" y="624" text-anchor="middle" class="node">Env Capabilities</text><text x="1005" y="645" text-anchor="middle" class="sub">manually declared frozenset</text>
    <rect x="240" y="737" width="230" height="68" rx="12" fill="#fff" stroke="#69b396"/><text x="355" y="762" text-anchor="middle" class="node">Vendor Driver</text><text x="355" y="783" text-anchor="middle" class="sub">serial / CAN / SDK</text>
    <rect x="500" y="737" width="300" height="68" rx="12" fill="#047857"/><text x="650" y="762" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Robot / Gripper / Suction</text><text x="650" y="783" text-anchor="middle" font-size="12" fill="#d1fae5">real robot body</text>
    <rect x="830" y="737" width="285" height="68" rx="12" fill="#047857"/><text x="973" y="762" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Camera / Depth</text><text x="973" y="783" text-anchor="middle" font-size="12" fill="#d1fae5">data source for visual perception</text>
  </g>
  <path d="M405 162H430" class="edge"/><path d="M620 162H645" class="edge"/><path d="M855 162H880" class="edge"/><path d="M998 194V225H678V252" class="edge"/><path d="M678 320V368" class="edge"/><path d="M678 434V456H725V482" class="edge"/><path d="M555 516H580" class="edge"/><path d="M870 516H895" class="edge"/><path d="M725 550V574H420V599" class="edge"/><path d="M600 633H625" class="edge"/><path d="M420 667V714H355V737" class="edge"/><path d="M470 771H500" class="edge"/><path d="M355 805V826H973V805" class="edge"/>

  <!-- Side panel: Skill Library -->
  <rect x="1240" y="102" width="388" height="218" rx="16" fill="#f3efff" stroke="#aa94e7"/><text x="1262" y="132" class="panel" fill="#6d28d9">Skill Library</text>
  <rect x="1270" y="153" width="328" height="62" rx="11" fill="#fff" stroke="#aa94e7"/><text x="1434" y="178" text-anchor="middle" class="node">SKILL.md</text><text x="1434" y="198" text-anchor="middle" class="sub">visual_pick · visual_place · transport</text>
  <rect x="1270" y="232" width="328" height="62" rx="11" fill="#fff8eb" stroke="#e8b75d"/><text x="1434" y="257" text-anchor="middle" class="node">loaded and injected by SkillUseRail</text><text x="1434" y="277" text-anchor="middle" class="sub">pre-orchestrated sequences for the Agent to compose</text>

  <!-- Side panel: Perception · Memory (merged guidance plane) -->
  <rect x="1240" y="335" width="388" height="508" rx="16" fill="#eefaf5" stroke="#83c5aa"/><text x="1262" y="365" class="panel" fill="#047857">Perception · Memory</text>
  <rect x="1270" y="396" width="328" height="66" rx="10" fill="#fff" stroke="#83c5aa"/><text x="1434" y="424" text-anchor="middle" class="node">perception</text><text x="1434" y="446" text-anchor="middle" class="sub">environment sensing: camera · depth · detection</text>
  <rect x="1270" y="486" width="328" height="66" rx="10" fill="#fff" stroke="#83c5aa"/><text x="1434" y="514" text-anchor="middle" class="node">kinematics</text><text x="1434" y="536" text-anchor="middle" class="sub">proprioception: URDF · FK / IK · reachability</text>
  <rect x="1270" y="576" width="328" height="66" rx="10" fill="#fff" stroke="#83c5aa"/><text x="1434" y="604" text-anchor="middle" class="node">WorldState + ExecutionMemory</text><text x="1434" y="626" text-anchor="middle" class="sub">execution memory: sense records, motion invalidates</text>
  <text x="1434" y="706" text-anchor="middle" class="node" fill="#047857">Guides the Agent's dynamic orchestration</text>
  <text x="1434" y="736" text-anchor="middle" class="sub">both Skill workflows and atomic ActionSpec actions</text>
  <text x="1434" y="764" text-anchor="middle" class="sub">the same task expands differently per environment</text>

  <!-- Skill Library -> Agent Layer -->
  <path d="M1240 150H1150" class="dash"/><text x="1195" y="130" class="label" text-anchor="middle">supports Agent</text><text x="1195" y="143" class="label" text-anchor="middle">orchestration</text>
  <!-- Perception / memory plane -> Agent Layer -->
  <path d="M1240 360H1180V218H1150" class="dash"/><text x="1145" y="212" class="label" text-anchor="end">drives Agent orchestration</text>
  <!-- API layer -> perception / memory plane -->
  <path d="M1150 516H1240" class="dash"/><text x="1195" y="496" class="label" text-anchor="middle">api/defaults</text><text x="1195" y="509" class="label" text-anchor="middle">calls these</text>
  <!-- Env layer -> perception / memory plane -->
  <path d="M1150 633H1240" class="dash"/><text x="1195" y="613" class="label" text-anchor="middle">observations</text><text x="1195" y="626" class="label" text-anchor="middle">feed sensing</text>

  <!-- Left gutter: observations and failures flow back up to the rails -->
  <path d="M228 843V306" class="dash"/><text x="214" y="600" class="label" text-anchor="middle" transform="rotate(-90 214 600)">observations &amp; failures flow back up</text>

  <line x1="1040" y1="956" x2="1080" y2="956" stroke="#334e68" stroke-width="2.2"/><text x="1090" y="960" class="legend">main execution dependency</text><line x1="1290" y1="956" x2="1330" y2="956" stroke="#d97706" stroke-width="2.2" stroke-dasharray="7 6"/><text x="1340" y="960" class="legend">guidance / gating / branch / feedback</text>
</svg>
