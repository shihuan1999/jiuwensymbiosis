<svg xmlns="http://www.w3.org/2000/svg" width="1876" height="1580" viewBox="0 0 1876 1580" role="img" aria-labelledby="title desc">
  <title id="title">JiuwenSymbiosis 单次任务调用时序</title><desc id="desc">九个架构域在一次任务中的调用时序：感知与执行记忆先决定初始动作序列，再在每个动作步前判定世界是否反驳前置条件，矛盾则重新快照并重规划剩余序列；每步结果经 record_action 写回记忆，下一轮读到的即是更新后的状态。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#334e68"/></marker><marker id="ret-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#d97706"/></marker>
    <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#172033}.title{font-size:29px;font-weight:700}.subtitle{font-size:14px;fill:#5b6b82}.actor{font-size:13px;font-weight:700}.actor-sub{font-size:10px;fill:#5b6b82}.phase{font-size:15px;font-weight:700}.msg{font-size:12px;font-weight:600}.note{font-size:11px;fill:#5b6b82}.call{stroke:#334e68;stroke-width:2.1;marker-end:url(#arrow)}.ret{stroke:#d97706;stroke-width:2.1;stroke-dasharray:7 5;marker-end:url(#ret-arrow)}.life{stroke:#9aabc0;stroke-width:1.4;stroke-dasharray:5 5}.legend{font-size:12px;fill:#526174}.bg{fill:#f4f7fc}.bg2{fill:#fdf5e6}.frame{fill:none;stroke:#8aa0b8;stroke-width:1.6;stroke-dasharray:7 5}.tag{font-size:11px;font-weight:700;fill:#33506e}</style>
  </defs>
  <rect width="1876" height="1580" rx="24" fill="#f4f7fc"/><text x="38" y="46" class="title">单次任务调用时序</text><text x="38" y="71" class="subtitle">主调用严格沿 Agent → Rails → Tool → API → Env → Hardware；感知与执行记忆先决定初始序列，再在每步前决定是否重规划</text>
  <rect x="28" y="142" width="1820" height="246" rx="16" fill="#eaf3ff" stroke="#b7d2f7"/><text x="45" y="169" class="phase" fill="#1d4ed8">A. 启动、装配与侧面机制初始化</text>
  <rect x="28" y="400" width="1820" height="820" rx="16" fill="#eefaf5" stroke="#acd9c6"/><text x="45" y="427" class="phase" fill="#047857">B. 规划与执行：感知 · 记忆驱动的动态编排</text>
  <rect x="28" y="1232" width="1820" height="104" rx="16" fill="#fff7e8" stroke="#efc36f"/><text x="45" y="1259" class="phase" fill="#b45309">C. invoke 收尾与证据</text>
  <rect x="28" y="1348" width="1820" height="166" rx="16" fill="#f3efff" stroke="#c9bbf3"/><text x="45" y="1375" class="phase" fill="#6d28d9">D. 会话关闭</text>

  <!-- 参与者：调用方 + 九域 -->
  <g>
    <rect x="30" y="88" width="130" height="42" rx="9" fill="#fff" stroke="#88afe8"/><text x="95" y="114" text-anchor="middle" class="actor">调用方</text>
    <rect x="195" y="88" width="130" height="42" rx="9" fill="#2563eb"/><text x="260" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">RobotSession</text><text x="260" y="121" text-anchor="middle" font-size="10" fill="#dbeafe">Agent Layer</text>
    <rect x="365" y="88" width="130" height="42" rx="9" fill="#fff" stroke="#88afe8"/><text x="430" y="106" text-anchor="middle" class="actor">Agent</text><text x="430" y="121" text-anchor="middle" class="actor-sub">任务编排 · 两级规划</text>
    <rect x="535" y="88" width="130" height="42" rx="9" fill="#fff8eb" stroke="#e8b75d"/><text x="600" y="106" text-anchor="middle" class="actor">Rails</text><text x="600" y="121" text-anchor="middle" class="actor-sub">Rails Layer</text>
    <rect x="705" y="88" width="130" height="42" rx="9" fill="#fff" stroke="#88afe8"/><text x="770" y="106" text-anchor="middle" class="actor">Tool Surface</text><text x="770" y="121" text-anchor="middle" class="actor-sub">Tool Layer</text>
    <rect x="875" y="88" width="130" height="42" rx="9" fill="#f5f1ff" stroke="#aa94e7"/><text x="940" y="106" text-anchor="middle" class="actor">Robot API</text><text x="940" y="121" text-anchor="middle" class="actor-sub">API Layer</text>
    <rect x="1045" y="88" width="130" height="42" rx="9" fill="#ecf9f4" stroke="#76bfa1"/><text x="1110" y="106" text-anchor="middle" class="actor">BaseRobotEnv</text><text x="1110" y="121" text-anchor="middle" class="actor-sub">Env Layer</text>
    <rect x="1215" y="88" width="130" height="42" rx="9" fill="#047857"/><text x="1280" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Driver / Hardware</text><text x="1280" y="121" text-anchor="middle" font-size="10" fill="#d1fae5">Hardware Layer</text>
    <rect x="1385" y="88" width="130" height="42" rx="9" fill="#f5f1ff" stroke="#aa94e7"/><text x="1450" y="106" text-anchor="middle" class="actor" fill="#6d28d9">技能库</text><text x="1450" y="121" text-anchor="middle" class="actor-sub" fill="#8b5cf6">Skill Library</text>
    <rect x="1555" y="88" width="130" height="42" rx="9" fill="#ecf9f4" stroke="#76bfa1"/><text x="1620" y="106" text-anchor="middle" class="actor" fill="#047857">感知 · 记忆</text><text x="1620" y="121" text-anchor="middle" class="actor-sub" fill="#059669">perception · kinematics</text>
  </g>
  <g><line x1="95" y1="130" x2="95" y2="1522" class="life"/><line x1="260" y1="130" x2="260" y2="1522" class="life"/><line x1="430" y1="130" x2="430" y2="1522" class="life"/><line x1="600" y1="130" x2="600" y2="1522" class="life"/><line x1="770" y1="130" x2="770" y2="1522" class="life"/><line x1="940" y1="130" x2="940" y2="1522" class="life"/><line x1="1110" y1="130" x2="1110" y2="1522" class="life"/><line x1="1280" y1="130" x2="1280" y2="1522" class="life"/><line x1="1450" y1="130" x2="1450" y2="1522" class="life"/><line x1="1620" y1="130" x2="1620" y2="1522" class="life"/></g>

  <!-- A. 启动：sidecar_starters 先于 _connect_env（session.connect 的实际顺序） -->
  <rect x="93" y="185" width="169" height="15" class="bg"/><line x1="95" y1="200" x2="260" y2="200" class="call"/><text x="178" y="196" text-anchor="middle" class="msg">进入 Session / connect()</text>
  <rect x="838" y="211" width="205" height="15" class="bg"/><line x1="260" y1="226" x2="1620" y2="226" class="ret"/><text x="940" y="222" text-anchor="middle" class="msg">可选：启动感知侧车（检测）</text>
  <rect x="636" y="237" width="98" height="15" class="bg"/><line x1="260" y1="252" x2="1110" y2="252" class="ret"/><text x="685" y="248" text-anchor="middle" class="msg">Env.connect()</text>
  <rect x="1154" y="263" width="82" height="15" class="bg"/><line x1="1110" y1="278" x2="1280" y2="278" class="ret"/><text x="1195" y="274" text-anchor="middle" class="msg">Driver 建连</text>
  <rect x="272" y="289" width="145" height="15" class="bg"/><line x1="260" y1="304" x2="430" y2="304" class="call"/><text x="345" y="300" text-anchor="middle" class="msg">构建 Agent 与工具集合</text>
  <rect x="700" y="286" width="560" height="42" rx="9" fill="#fff" stroke="#b9a8ec"/><text x="980" y="303" text-anchor="middle" class="msg">构建阶段能力门控</text><text x="980" y="319" text-anchor="middle" class="note">Tool Surface = ActionSpec 能力 ∩ Env 硬件能力</text>
  <rect x="852" y="341" width="176" height="15" class="bg"/><line x1="1450" y1="356" x2="430" y2="356" class="ret"/><text x="940" y="352" text-anchor="middle" class="msg">可选：加载 SKILL.md 动作序列</text>

  <!-- B1. 规划：世界状态 + 技能库 决定初始序列 -->
  <rect x="147" y="443" width="62" height="15" class="bg"/><line x1="95" y1="458" x2="260" y2="458" class="call"/><text x="178" y="454" text-anchor="middle" class="msg">提交任务</text>
  <rect x="296" y="469" width="98" height="15" class="bg"/><line x1="260" y1="484" x2="430" y2="484" class="call"/><text x="345" y="480" text-anchor="middle" class="msg">invoke(query)</text>
  <rect x="955" y="495" width="141" height="15" class="bg"/><line x1="430" y1="510" x2="1620" y2="510" class="ret"/><text x="1025" y="506" text-anchor="middle" class="msg">WorldState.snapshot()</text>
  <rect x="895" y="521" width="260" height="15" class="bg"/><line x1="1620" y1="536" x2="430" y2="536" class="ret"/><text x="1025" y="532" text-anchor="middle" class="msg">本体状态 · 位置清单（带新鲜度）· 可达性标注</text>
  <rect x="890" y="547" width="100" height="15" class="bg"/><line x1="1450" y1="562" x2="430" y2="562" class="ret"/><text x="940" y="558" text-anchor="middle" class="msg">能力过滤后的技能库</text>
  <rect x="300" y="576" width="360" height="54" rx="9" fill="#fff" stroke="#b9a8ec"/><text x="480" y="597" text-anchor="middle" class="msg">plan_task：Tier1 技能组合 / Tier2 动作组合</text><text x="480" y="616" text-anchor="middle" class="note">parse_sequence 校验前置条件后才开始执行</text>

  <!-- B2. 每个动作步的循环 -->
  <rect x="396" y="644" width="1268" height="552" rx="10" class="frame"/>
  <rect x="396" y="644" width="152" height="22" rx="8" fill="#dbe6f3"/><text x="406" y="660" class="tag">loop　每个动作步</text>
  <rect x="931" y="675" width="188" height="15" class="bg"/><line x1="430" y1="690" x2="1620" y2="690" class="ret"/><text x="1025" y="686" text-anchor="middle" class="msg">_drift：前置条件是否被实测反驳</text>
  <rect x="926" y="701" width="198" height="15" class="bg"/><line x1="1620" y1="716" x2="430" y2="716" class="ret"/><text x="1025" y="712" text-anchor="middle" class="msg">矛盾原因 / 无矛盾（未知不算反驳）</text>
  <rect x="410" y="720" width="1240" height="60" rx="8" fill="#fdf5e6" stroke="#e8b75d" stroke-dasharray="5 4"/><text x="420" y="735" class="tag" fill="#b45309">alt　世界反驳了前置条件</text>
  <rect x="881" y="727" width="289" height="15" class="bg2"/><line x1="430" y1="742" x2="1620" y2="742" class="ret"/><text x="1025" y="738" text-anchor="middle" class="msg">重新 WorldState.snapshot()</text>
  <rect x="898" y="753" width="254" height="15" class="bg2"/><line x1="1620" y1="768" x2="430" y2="768" class="ret"/><text x="1025" y="764" text-anchor="middle" class="msg">实测世界状态 → 重规划剩余序列（≤ max_replans）</text>
  <rect x="436" y="785" width="159" height="15" class="bg"/><line x1="430" y1="800" x2="600" y2="800" class="call"/><text x="515" y="796" text-anchor="middle" class="msg">[无矛盾] before_tool_call</text>
  <rect x="538" y="816" width="124" height="46" rx="8" fill="#fff8eb" stroke="#e8b75d"/><text x="600" y="835" text-anchor="middle" class="msg">检查与门控</text><text x="600" y="851" text-anchor="middle" class="note">必要时拒绝</text>
  <rect x="1300" y="826" width="300" height="56" rx="9" fill="#fff" stroke="#b9a8ec"/><text x="1450" y="848" text-anchor="middle" class="msg">追踪复合步：双速环</text><text x="1450" y="866" text-anchor="middle" class="note">BackgroundTracker + ServoController</text>
  <rect x="456" y="873" width="118" height="15" class="bg"/><line x1="600" y1="888" x2="430" y2="888" class="ret"/><text x="515" y="884" text-anchor="middle" class="msg">允许 / 可纠正错误</text>
  <rect x="551" y="899" width="98" height="15" class="bg"/><line x1="430" y1="914" x2="770" y2="914" class="call"/><text x="600" y="910" text-anchor="middle" class="msg">调用已暴露工具</text>
  <rect x="783" y="925" width="144" height="15" class="bg"/><line x1="770" y1="940" x2="940" y2="940" class="call"/><text x="855" y="936" text-anchor="middle" class="msg">@implements 绑定与分派</text>
  <rect x="977" y="951" width="96" height="15" class="bg"/><line x1="940" y1="966" x2="1110" y2="966" class="call"/><text x="1025" y="962" text-anchor="middle" class="msg">稳定 Env 动词</text>
  <rect x="1144" y="977" width="102" height="15" class="bg"/><line x1="1110" y1="992" x2="1280" y2="992" class="call"/><text x="1195" y="988" text-anchor="middle" class="msg">SDK / 协议命令</text>
  <rect x="1132" y="1003" width="126" height="15" class="bg"/><line x1="1280" y1="1018" x2="1110" y2="1018" class="ret"/><text x="1195" y="1014" text-anchor="middle" class="msg">状态 / 图像 / 结果</text>
  <rect x="1187" y="1029" width="186" height="15" class="bg"/><line x1="940" y1="1044" x2="1620" y2="1044" class="ret"/><text x="1280" y="1040" text-anchor="middle" class="msg">可选：defaults 调用共享感知算法</text>
  <rect x="930" y="1055" width="189" height="15" class="bg"/><line x1="1110" y1="1070" x2="940" y2="1070" class="ret"/><text x="1025" y="1066" text-anchor="middle" class="msg">RobotObservation / API 结果</text>
  <rect x="824" y="1081" width="62" height="15" class="bg"/><line x1="940" y1="1096" x2="770" y2="1096" class="ret"/><text x="855" y="1092" text-anchor="middle" class="msg">工具结果</text>
  <rect x="1080" y="1107" width="230" height="15" class="bg"/><line x1="770" y1="1122" x2="1620" y2="1122" class="ret"/><text x="1195" y="1118" text-anchor="middle" class="msg">record_action：感知即入账、移动即作废</text>
  <rect x="561" y="1133" width="78" height="15" class="bg"/><line x1="770" y1="1148" x2="430" y2="1148" class="ret"/><text x="600" y="1144" text-anchor="middle" class="msg">返回 Agent</text>
  <rect x="437" y="1159" width="156" height="15" class="bg"/><line x1="430" y1="1174" x2="600" y2="1174" class="call"/><text x="515" y="1170" text-anchor="middle" class="msg">after_tool_call(result)</text>
  <text x="1030" y="1212" text-anchor="middle" class="note">记账后回到循环开头 —— 下一轮 _drift 读到的是更新后的记忆与位置</text>

  <!-- C. invoke 收尾与证据 -->
  <rect x="478" y="1257" width="74" height="15" class="bg"/><line x1="430" y1="1272" x2="600" y2="1272" class="call"/><text x="515" y="1268" text-anchor="middle" class="msg">after_invoke</text>
  <rect x="450" y="1286" width="300" height="40" rx="9" fill="#fff8eb" stroke="#e8b75d"/><text x="600" y="1303" text-anchor="middle" class="msg">TraceRail 采集：事件 · 摘要 · 帧 · 日志</text><text x="600" y="1319" text-anchor="middle" class="note">invoke 结束时写入 &lt;workspace&gt;/traces/</text>

  <!-- D. 会话关闭：trace close 先于 env.disconnect 先于 sidecar 停止 -->
  <rect x="134" y="1377" width="89" height="15" class="bg"/><line x1="95" y1="1392" x2="260" y2="1392" class="ret"/><text x="178" y="1388" text-anchor="middle" class="msg">退出 Session</text>
  <rect x="335" y="1403" width="190" height="15" class="bg"/><line x1="260" y1="1418" x2="600" y2="1418" class="ret"/><text x="430" y="1414" text-anchor="middle" class="msg">TraceRail.close()：兜底 flush</text>
  <rect x="627" y="1429" width="115" height="15" class="bg"/><line x1="260" y1="1444" x2="1110" y2="1444" class="ret"/><text x="685" y="1440" text-anchor="middle" class="msg">Env.disconnect()</text>
  <rect x="1146" y="1455" width="99" height="15" class="bg"/><line x1="1110" y1="1470" x2="1280" y2="1470" class="ret"/><text x="1195" y="1466" text-anchor="middle" class="msg">Driver.close()</text>
  <rect x="865" y="1481" width="149" height="15" class="bg"/><line x1="260" y1="1496" x2="1620" y2="1496" class="ret"/><text x="940" y="1492" text-anchor="middle" class="msg">停止感知侧车（检测）</text>
  <line x1="1160" y1="1542" x2="1200" y2="1542" stroke="#334e68" stroke-width="2.1"/><text x="1210" y="1546" class="legend">主调用</text><line x1="1330" y1="1542" x2="1370" y2="1542" stroke="#d97706" stroke-width="2.1" stroke-dasharray="7 5"/><text x="1380" y="1546" class="legend">返回 / 可选支路 / 生命周期</text>
</svg>
