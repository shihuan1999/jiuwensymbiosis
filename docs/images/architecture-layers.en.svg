<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">JiuwenSymbiosis eight architectural domains</title><desc id="desc">A six-layer runtime execution chain from Agent to Hardware; Skill guidance and a perception/memory plane join from the side, forming a Perceive → Plan → Execute → Observe → Feedback loop.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker><marker id="dash-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#d97706"/></marker><filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#19324d" flood-opacity="0.12"/></filter>
    <style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#172033}.title{font-size:29px;font-weight:700}.subtitle{font-size:14px;fill:#5b6b82}.name{font-size:17px;font-weight:700;fill:#fff}.node{font-size:16px;font-weight:700}.sub{font-size:13px;fill:#5b6b82}.label{font-size:13px;font-weight:700}.legend{font-size:12px;fill:#526174}</style>
  </defs>
  <rect width="1200" height="820" rx="24" fill="#f4f7fc"/><text x="42" y="48" style="font-size:21px" class="title">Nine Domains: six-layer chain + two guidance planes (Perception · Execution Memory) + a Skill Library</text><text x="42" y="73" class="subtitle">The main chain carries runtime tool calls; the Skill Library is loaded by SkillUseRail for the Agent to use on demand;</text><text x="42" y="93" class="subtitle">environment and proprioceptive sensing along with execution memory drive the Agent&#8217;s dynamic orchestration.</text>

  <!-- Left: six-layer runtime chain -->
  <g filter="url(#shadow)">
    <rect x="90" y="110" width="720" height="84" rx="14" fill="#fff" stroke="#9bbcea"/><rect x="90" y="110" width="160" height="84" rx="14" fill="#2563eb"/><rect x="250" y="110" width="14" height="84" fill="#2563eb"/><text x="170" y="160" text-anchor="middle" class="name">Agent Layer</text><text x="278" y="145" class="node">RobotSession · build_robot_agent() · run_robot_task()</text><text x="278" y="169" class="sub">task entry, assembly, session lifecycle, and model orchestration</text>
    <rect x="90" y="212" width="720" height="84" rx="14" fill="#fff" stroke="#efc36f"/><rect x="90" y="212" width="160" height="84" rx="14" fill="#d97706"/><rect x="250" y="212" width="14" height="84" fill="#d97706"/><text x="170" y="262" text-anchor="middle" class="name">Rails Layer</text><text x="278" y="247" class="node">Safety · Recovery · VisualFeedback · Trace · Diagnosis</text><text x="278" y="271" class="sub">checks, recovery, feedback, and execution evidence around tool calls</text>
    <rect x="90" y="314" width="720" height="84" rx="14" fill="#fff" stroke="#9bbcea"/><rect x="90" y="314" width="160" height="84" rx="14" fill="#3b82f6"/><rect x="250" y="314" width="14" height="84" fill="#3b82f6"/><text x="170" y="364" text-anchor="middle" class="name">Tool Layer</text><text x="278" y="349" class="node">build_robot_tools · RobotControlTool · InProcessCodeTool</text><text x="278" y="373" class="sub">exposes only the actions in the API ∩ Env capability intersection</text>
    <rect x="90" y="416" width="720" height="84" rx="14" fill="#fff" stroke="#b9a8ec"/><rect x="90" y="416" width="160" height="84" rx="14" fill="#8b5cf6"/><rect x="250" y="416" width="14" height="84" fill="#8b5cf6"/><text x="170" y="466" text-anchor="middle" class="name">API Layer</text><text x="278" y="451" class="node">ActionSpec · Capability · @implements(SPEC) · defaults</text><text x="278" y="475" class="sub">action contract + capability gating</text>
    <rect x="90" y="518" width="720" height="84" rx="14" fill="#fff" stroke="#83c5aa"/><rect x="90" y="518" width="160" height="84" rx="14" fill="#059669"/><rect x="250" y="518" width="14" height="84" fill="#059669"/><text x="170" y="568" text-anchor="middle" class="name">Env Layer</text><text x="278" y="553" class="node">BaseRobotEnv · RobotObservation</text><text x="278" y="577" class="sub">single hardware contract, capability declaration, structured state</text>
    <rect x="90" y="620" width="720" height="84" rx="14" fill="#fff" stroke="#69b396"/><rect x="90" y="620" width="160" height="84" rx="14" fill="#047857"/><rect x="250" y="620" width="14" height="84" fill="#047857"/><text x="170" y="670" text-anchor="middle" class="name">Hardware Layer</text><text x="278" y="655" class="node">Vendor Driver · Robot · Gripper · Camera</text><text x="278" y="679" class="sub">vendor SDKs, serial, CAN, sockets, and physical devices</text>
  </g>
  <g><path d="M450 194V212" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 296V314" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 398V416" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 500V518" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 602V620" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/></g>

  <!-- Right: Skill panel -->
  <rect x="870" y="110" width="270" height="280" rx="18" fill="#f3efff" stroke="#aa94e7" stroke-width="2"/><rect x="870" y="110" width="270" height="58" rx="18" fill="#7c3aed"/><rect x="870" y="152" width="270" height="16" fill="#7c3aed"/><text x="1005" y="145" text-anchor="middle" class="name">Skill Library</text><text x="1005" y="202" text-anchor="middle" class="node">SKILL.md</text><text x="1005" y="230" text-anchor="middle" class="sub">visual_pick · visual_place · transport</text><text x="1005" y="259" text-anchor="middle" class="sub">loaded by SkillUseRail</text><text x="1005" y="302" text-anchor="middle" class="sub">provides pre-orchestrated action sequences</text><text x="1005" y="328" text-anchor="middle" class="sub">for the Agent to compose</text><text x="1005" y="354" text-anchor="middle" class="sub">into long-horizon task flows</text>

  <!-- Right: merged perception / memory plane -->
  <rect x="870" y="406" width="270" height="298" rx="18" fill="#eefaf5" stroke="#83c5aa" stroke-width="2"/><rect x="870" y="406" width="270" height="58" rx="18" fill="#059669"/><rect x="870" y="448" width="270" height="16" fill="#059669"/><text x="1005" y="441" text-anchor="middle" class="name">Perception · Memory</text><text x="1005" y="500" text-anchor="middle" class="node">perception</text><text x="1005" y="526" text-anchor="middle" class="node">kinematic</text><text x="1005" y="552" text-anchor="middle" class="node">WorldState + ExecutionMemory</text><text x="1005" y="674" text-anchor="middle" font-size="11" class="sub">supports Agent orchestration of Skill workflows</text><text x="1005" y="700" text-anchor="middle" font-size="11" class="sub">and atomic ActionSpec actions</text>

  <!-- Skill panel guides the Agent -->
  <path d="M870 180H810" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#dash-arrow)"/><text x="822" y="197" text-anchor="middle" class="label" fill="#b45309">supports Agent orchestration</text>

  <!-- Feedback loop: Hardware left edge -> up the left gutter -> into the Agent layer -->
  <path d="M60 696V152" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#dash-arrow)"/><text x="44" y="401" text-anchor="middle" class="label" fill="#b45309" transform="rotate(-90 44 401)">observations and failures flow upward</text>

  <line x1="760" y1="775" x2="800" y2="775" stroke="#2563eb" stroke-width="2.5"/><text x="810" y="779" class="legend">runtime call</text>
</svg>
